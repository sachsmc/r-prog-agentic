name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The retrieval evaluation in CI uses a few of the reference sources.
      REFS_SUBSET: "1"
      REFS_IDS: adv-r r4ds r-intro tidy-data cheatsheets
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('build/r-packages.txt') }}

      - name: Install R packages
        run: Rscript build/install_r_packages.R

      - name: Build the course material
        run: make course

      - name: Cache reference sources
        uses: actions/cache@v4
        with:
          path: |
            .cache/refs-src
            ~/.cache/huggingface
          key: refs-${{ hashFiles('sources.yml', 'build/searchlib.py') }}

      - name: Build a subset of the references
        run: uv run build/fetch_refs.py --only $REFS_IDS

      - name: Build the search index
        run: make index

      - name: Unit tests and retrieval evaluation
        run: make test
