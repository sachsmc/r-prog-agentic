name: Sync course material

# Rebuild course/ from the course repo when it has new commits, and open a
# pull request with the result.

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Move the pin to the newest commit
        id: pin
        run: |
          uv run build/convert_course.py --update-pin
          if git diff --quiet sources.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.pin.outputs.changed == 'true'
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.pin.outputs.changed == 'true'

      - name: Rebuild the course material
        if: steps.pin.outputs.changed == 'true'
        run: |
          Rscript build/install_r_packages.R
          make course

      - name: Open a pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync-course-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sources.yml course
          git commit -m "Sync course material with the course repo"
          git push --force origin "$branch"
          gh pr create --title "Sync course material with the course repo" \
            --body "The course repo has new commits. This rebuilds course/ from the new pin in sources.yml. Check the diff of the lectures before merging. If a lecture was added, add its goals to build/syllabus.yml." \
            || echo "A pull request for this branch already exists."
