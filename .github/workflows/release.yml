name: Release course.md

# Publishes course/course.md as a release asset, for students who use a chat
# assistant without a terminal. Runs when a tag like v2026.11 is pushed.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" course/course.md \
            --title "Course material $GITHUB_REF_NAME" \
            --notes "course.md holds the syllabus, lectures, exercises and solutions in one file. Upload it to a chat assistant to use the course without a terminal."
