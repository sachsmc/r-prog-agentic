# Pinned upstream sources. `make course` and `make refs` build only from these pins.

course:
  repo: https://github.com/sachsmc/r-programming.git
  pin: ae3897cf8537b835abcbf1803b646e7cef2b71af
  licence: MIT
  # .R solution files in exercises/solutions/, and the exercise set each belongs to
  solution_scripts:
    functions.R: functions
    loops.R: flow-and-loops
    tidy.R: tidy-and-reshape
  # worked project folders in exercises/solutions/, copied as they are
  solution_projects:
    - penguins-analysis
    - register-project
  # files outside data/ that lecture code reads
  extra_data:
    - lectures/reg-ex.rds

# Reference sources. Licences were read from each upstream repo or site on
# 12 Nov 2026 (see licence_note). `redistributable: true` means the licence
# allows sharing a processed copy. Everything else is built on the student's
# own machine and never committed.
#
# parser: bookdown (also Quarto books), texinfo, pdf
# fetch:  tarball (top-level text files of the repo) or files (the listed files)
references:
  - id: r-intro
    title: An Introduction to R
    authors: W. N. Venables, D. M. Smith and the R Core Team
    edition: R 4.6.2
    url: https://cran.r-project.org/doc/manuals/r-release/R-intro.html
    upstream: wch/r-source
    pin: e85781e32cde2aa7021b921ee183972bd7988448   # branch tags/R-4-6-2
    fetch: files
    files: [doc/manual/R-intro.texi]
    parser: texinfo
    licence: R manual permission notice (verbatim and modified copies allowed if the notice is kept)
    licence_note: read from the permission macro in doc/manual/R-defs.texi
    redistributable: true
    status: ok

  - id: r4ds
    title: R for Data Science
    authors: Hadley Wickham and Garrett Grolemund
    edition: 1st edition
    url: https://r4ds.had.co.nz/
    upstream: hadley/r4ds
    pin: 2390ed29b182824f8d72ef7a30e365775395fc6f   # tag first-ed
    parser: bookdown
    options: {split: chapter}
    licence: CC BY-NC-ND 3.0 US
    licence_url: http://creativecommons.org/licenses/by-nc-nd/3.0/us/
    licence_note: LICENSE file and index.Rmd in the repo
    redistributable: false
    status: ok

  - id: moderndive
    title: Statistical Inference via Data Science
    authors: Chester Ismay, Albert Y. Kim and Arturo Valdivia
    edition: 2nd edition
    url: https://moderndive.com/v2/
    upstream: moderndive/ModernDive_book
    pin: 4d0ca349f996682a0f36929604b6ce8ea9b76bee
    fetch: files
    files:
      - index.qmd
      - 00-foreword.qmd
      - 00-preface.qmd
      - 01-getting-started.qmd
      - 02-visualization.qmd
      - 03-wrangling.qmd
      - 04-tidy.qmd
      - 05-regression.qmd
      - 06-multiple-regression.qmd
      - 07-sampling.qmd
      - 08-confidence-intervals.qmd
      - 09-hypothesis-testing.qmd
      - 10-inference-for-regression.qmd
      - 11-tell-your-story-with-data.qmd
      - 91-appendixA.qmd
      - 92-appendixB.qmd
      - 93-appendixC.qmd
      - 94-appendixD.qmd
      - 95-appendixE.qmd
      - 96-glossary.qmd
    parser: bookdown
    options: {split: quarto, files_from_fetch: true}
    licence: CC BY-NC-SA 4.0
    licence_url: http://creativecommons.org/licenses/by-nc-sa/4.0/
    licence_note: LICENSE.md and index.qmd in the repo
    redistributable: false
    status: ok

  - id: hopr
    title: Hands-On Programming with R
    authors: Garrett Grolemund
    edition: online edition
    url: https://rstudio-education.github.io/hopr/
    upstream: rstudio-education/hopr
    pin: fbd5536401eb0b822ee3ab457f996c3c4846ec54
    parser: bookdown
    options: {split: chapter}
    licence: CC BY-NC-ND 4.0
    licence_url: https://creativecommons.org/licenses/by-nc-nd/4.0/
    licence_note: LICENSE file and index.rmd in the repo
    redistributable: false
    status: ok

  - id: adv-r
    title: Advanced R
    authors: Hadley Wickham
    edition: 2nd edition
    url: https://adv-r.hadley.nz/
    upstream: hadley/adv-r
    pin: 63ea8d94cdfbb13fd5dcee7d3d5e3b1e848dc7b3
    parser: bookdown
    options: {split: chapter}
    licence: CC BY-NC-SA 4.0 (code also MIT)
    licence_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    licence_note: LICENSE.md and index.Rmd in the repo
    redistributable: false
