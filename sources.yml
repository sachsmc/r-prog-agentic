    parser: bookdown
    options: {split: section}
    licence: CC BY-NC-SA 4.0
    licence_url: http://creativecommons.org/licenses/by-nc-sa/4.0/
    licence_note: LICENSE file and index.Rmd in the repo
    redistributable: false
    status: ok

  - id: rmd-cookbook
    title: R Markdown Cookbook
    authors: Yihui Xie, Christophe Dervieux and Emily Riederer
    edition: online edition
    url: https://bookdown.org/yihui/rmarkdown-cookbook/
    upstream: yihui/rmarkdown-cookbook
    pin: 7c8ee0ab295dfe29e3b35f5d38f6a3553933a422
    parser: bookdown
    options: {split: section}
    licence: CC BY-NC-SA 4.0
    licence_url: http://creativecommons.org/licenses/by-nc-sa/4.0/
    licence_note: statement in index.Rmd. The repo has no LICENSE file.
    redistributable: false
    status: ok

  - id: tidy-data
    title: Tidy Data
    authors: Hadley Wickham
    edition: Journal of Statistical Software 59(10), 2014
    url: https://www.jstatsoft.org/article/view/v059i10
    upstream: sachsmc/r-programming
    pin: ae3897cf8537b835abcbf1803b646e7cef2b71af
    fetch: files
    files: [wickham-tidy-data-2014-jssv59i10.pdf]
    parser: pdf
    options:
      mode: article
      drop_lines: ['^\d+ Tidy Data$', '^Journal of Statistical Software \d+$']
    licence: CC BY 3.0
    licence_url: http://creativecommons.org/licenses/by/3.0/
    licence_note: stated on the article page at jstatsoft.org
    redistributable: true
    status: ok

  - id: layered-grammar
    title: A Layered Grammar of Graphics
    authors: Hadley Wickham
    edition: Journal of Computational and Graphical Statistics 19(1), 2010
    url: https://doi.org/10.1198/jcgs.2009.07098
    upstream: sachsmc/r-programming
    pin: ae3897cf8537b835abcbf1803b646e7cef2b71af
    fetch: files
    files: [layered-grammar.pdf]
    parser: pdf
    options:
      mode: article
      drop_lines: ['^\d+ H\. ?W ?ICKHAM$', '^A ?L ?AYERED ?G ?RAMMAR OF ?G ?RAPHICS \d+$']
      heading_titles:
        "1": Introduction
        "2": How to build a plot
        "2.1": A basic plot
        "2.2": A more complicated plot
        "3": Components of the layered grammar
        "3.1": Layers
        "3.2": Scales
        "3.3": Coordinate system
        "3.4": Faceting
        "4": A hierarchy of defaults
        "5": An embedded grammar
        "6": Implications of the layered grammar
        "6.1": Histograms
        "6.2": Polar coordinates
        "6.3": Transformations
        "7": Perceptual issues
        "8": Conclusions
    licence: copyright 2010 American Statistical Association and others. Not an open licence.
    licence_note: copyright line on page 1 of the PDF. Built locally from the PDF in the course repo. Ask Michael.
    redistributable: false
    status: ok

